    <script>
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const cards = document.querySelectorAll('.ad-card');
    const noResults = document.getElementById('no-results');
    
    console.log('Скрипт загружен!');
    
    // Добавляем ключевые слова для каждой карточки вручную
    const keywords = [
      'legendary motosport',                    // 1 карточка
      'luxury real estate недвижимость элитная',        // 2 карточка
      'maze bank банк деньги финансы',                  // 3 карточка
      'diamond casino',                   // 4 карточка
      'san andreas игра gta',                            // 5 карточка
      'los santos customs тюнинг авто транспорт',        // 6 карточка
      'vinewood развлечения шоу голливуд',               // 7 карточка
      'bawsaq биржа финансы инвестиции акции',           // 8 карточка
      'gta online мультиплеер',                          // 9 карточка
      'gta форумы обсуждения сообщество',                // 10 карточка
      'gta 6 новости слухи',                             // 11 карточка
      'gta читы коды секреты'                            // 12 карточка
    ];
    
    // Функция поиска
    function performSearch() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      let visibleCount = 0;
      
      console.log('Поиск по запросу: "' + searchTerm + '"');
      
      cards.forEach((card, index) => {
        // Получаем ключевые слова для этой карточки
        const cardKeywords = keywords[index] || '';
        
        // Получаем alt текст изображения
        const img = card.querySelector('img');
        const altText = img ? img.alt.toLowerCase() : '';
        
        // Получаем текст из placeholder (РЕКЛАМА)
        const placeholderText = card.querySelector('.ad-img-placeholder-text');
        const placeholderContent = placeholderText ? placeholderText.textContent.toLowerCase() : '';
        
        // Объединяем всё для поиска
        const searchableText = cardKeywords + ' ' + altText + ' ' + placeholderContent;
        
        console.log(`Карточка ${index + 1}:`, {
          keywords: cardKeywords,
          alt: altText,
          searchableText: searchableText
        });
        
        // Если поисковый запрос пустой - показываем все карточки
        if (searchTerm === '') {
          card.classList.remove('hidden');
          visibleCount++;
        } 
        // Иначе проверяем, есть ли совпадение в поисковом тексте
        else if (searchableText.includes(searchTerm)) {
          card.classList.remove('hidden');
          visibleCount++;
          console.log(`✓ Карточка ${index + 1} подходит`);
        } else {
          card.classList.add('hidden');
          console.log(`✗ Карточка ${index + 1} не подходит`);
        }
      });
      
      console.log('Найдено карточек:', visibleCount);
      
      // Показываем сообщение если ничего не найдено
      if (noResults) {
        if (visibleCount === 0 && searchTerm !== '') {
          noResults.style.display = 'block';
        } else {
          noResults.style.display = 'none';
        }
      }
    }
    
    // Добавляем обработчики событий
    searchInput.addEventListener('input', function() {
      // Используем setTimeout для оптимизации
      clearTimeout(window.searchTimeout);
      window.searchTimeout = setTimeout(performSearch, 300);
    });
    
    if (searchBtn) {
      searchBtn.addEventListener('click', function(e) {
        e.preventDefault();
        performSearch();
      });
    }
    
    searchInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });

     let btn_exit = document.querySelector('.red').addEventListener('click',()=>{
            window.location = '../page3/index3.html'
        })

      let btn_exits = document.querySelectorAll('.exit').forEach((e)=>e.addEventListener('click',()=>{
            window.location = '../pageError/index.html'
        }))
    
    // Выполняем поиск при загрузке (показывает все карточки)
    performSearch();
  });
</script>
