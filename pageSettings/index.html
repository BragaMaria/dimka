.buttons{

.blob-btn {
  z-index: 1;
  position: relative;
  padding: 20px 46px;
  margin-bottom: 30px;
  text-align: center;
  text-transform: uppercase;
  color: #0505A9;
  font-size: 16px;
  font-weight: bold;
  background-color: transparent;
  outline: none;
  border: none;
  transition: color 0.5s;
  cursor: pointer;
  border-radius: 30px;
}
.blob-btn:before {
  content: "";
  z-index: 1;
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  border: 2px solid #0505A9;
  border-radius: 30px;
}
.blob-btn:after {
  content: "";
  z-index: -2;
  position: absolute;
  left: 3px;
  top: 3px;
  width: 100%;
  height: 100%;
  transition: all 0.3s 0.2s;
  border-radius: 30px;
}
.blob-btn:hover {
  color: #FFFFFF;
  border-radius: 30px;
}
.blob-btn:hover:after {
  transition: all 0.3s;
  left: 0;
  top: 0;
  border-radius: 30px;
}
.blob-btn__inner {
  z-index: -1;
  overflow: hidden;
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  border-radius: 30px;
  background: #ffffff;
}
.blob-btn__blobs {
  position: relative;
  display: block;
  height: 100%;
  filter: url("#goo");
}
.blob-btn__blob {
  position: absolute;
  top: 2px;
  width: 25%;
  height: 100%;
  background: #0505A9;
  border-radius: 100%;
  transform: translate3d(0, 150%, 0) scale(1.7);
  transition: transform 0.45s;
}
@supports (filter: url("#goo")) {
  .blob-btn__blob {
    transform: translate3d(0, 150%, 0) scale(1.4);
  }
}
.blob-btn__blob:nth-child(1) {
  left: 0%;
  transition-delay: 0s;
}
.blob-btn__blob:nth-child(2) {
  left: 30%;
  transition-delay: 0.08s;
}
.blob-btn__blob:nth-child(3) {
  left: 60%;
  transition-delay: 0.16s;
}
.blob-btn__blob:nth-child(4) {
  left: 90%;
  transition-delay: 0.24s;
}
.blob-btn:hover .blob-btn__blob {
  transform: translateZ(0) scale(1.7);
}
@supports (filter: url("#goo")) {
  .blob-btn:hover .blob-btn__blob {
    transform: translateZ(0) scale(1.4);
  }
}
    </style>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const phone = document.querySelector(".phone");

    // Все готовые цвета
    const colorInputs = document.querySelectorAll(
        'input[name="color"][data-color]'
    );

    colorInputs.forEach(input => {

        input.addEventListener("change", function () {

            const color = this.dataset.color;

            // Меняем рамку телефона
            phone.style.borderColor = color;

            // Убираем active у всех
            document.querySelectorAll(".item").forEach(item => {
                item.classList.remove("active");
            });

            // Добавляем active выбранному
            this.closest(".item").classList.add("active");
        });

    });


    // Свой цвет
    const customRadio = document.getElementById("customColorRadio");
    const customPicker = document.getElementById("customColorPicker");
    const customItem = customRadio.closest(".item");
    const customPreview = customItem.querySelector(".custom-color");


    // Нажали на "Свой цвет"
    customPreview.addEventListener("click", function () {

        customRadio.checked = true;

        // Открываем палитру
        customPicker.click();

    });


    // Пользователь выбрал цвет
    customPicker.addEventListener("input", function () {

        const color = this.value;

        // Меняем рамку телефона
        phone.style.borderColor = color;

        // Выделяем "Свой цвет"
        document.querySelectorAll(".item").forEach(item => {
            item.classList.remove("active");
        });

        customItem.classList.add("active");

    });

});
</script>

    <script>



        const colors = ['white', 'black', '#0ddaf2', 'blue', 'red', 'yellow', '#9219e6', '#66dc23', '#f94ad3', '#854f3f','#f07100'];

colors.forEach(color => {
    const radio = document.querySelector(`input[name="color"][class="${color}"]`);
    if (radio) {
        radio.addEventListener('change', function() {
            if (this.checked) {
                document.querySelector('.phone').style.borderColor = color;
            }
        });
    }
});

        function toggleSound(soundId) {
    const audio = document.getElementById(soundId);
    const img = document.getElementById('img-' + soundId);
    
    if (audio.paused) {
        audio.play().catch(error => {
            console.log('Ошибка воспроизведения:', error);
        });
        if (img) img.src = '../assets/images/play.png'; // меняем иконку на паузу
    } else {
        audio.pause();
        if (img) img.src = '../assets/images/play.png'; // меняем иконку на play
    }
}

let currentDayIndex = 6; // 0 = Вс

const timeElement = document.getElementById("time");
const dayElement = document.querySelector(".status-bar .left span:nth-child(3)"); // элемент с днём недели

// Функция форматирования времени (08:05 → 8:05, 13:40 → 13:40)
function formatGameTime() {
  const h = String(gameHour).padStart(2, "0");
  const m = String(gameMinute).padStart(2, "0");
  return `${h}:${m}`;
}

// Обновление отображения
function renderTimeAndDay() {
  timeElement.textContent = formatGameTime();
  dayElement.textContent = daysOfWeek[currentDayIndex];
}

// Основной тик времени
function advanceGameTime() {
  gameMinute++;

  if (gameMinute >= 60) {
    gameMinute = 0;
    gameHour++;

    if (gameHour >= 24) {
      gameHour = 0;
      // Смена дня недели
      currentDayIndex = (currentDayIndex + 1) % 7;
      renderTimeAndDay(); // день сменился → сразу обновляем и день
    }
  }

  renderTimeAndDay();
}

// Запускаем игру времени
setInterval(advanceGameTime, REAL_SECONDS_PER_GAME_MINUTE * 1000);

// Первое отображение (чтобы не ждать первую итерацию)
renderTimeAndDay();
    </script>
</body>
</html>
