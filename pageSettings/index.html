.buttons{
    margin-top: 20px;

.blob-btn {
  z-index: 1;
  position: relative;
  padding: 20px 46px;
  margin-bottom: 30px;
  text-align: center;
  text-transform: uppercase;
  color: #0505A9;
  font-size: 16px;
  font-weight: bold;
  background-color: transparent;
  outline: none;
  border: none;
  transition: color 0.5s;
  cursor: pointer;
  border-radius: 30px;
}
.blob-btn:before {
  content: "";
  z-index: 1;
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  border: 2px solid #0505A9;
  border-radius: 30px;
}
.blob-btn:after {
  content: "";
  z-index: -2;
  position: absolute;
  left: 3px;
  top: 3px;
  width: 100%;
  height: 100%;
  transition: all 0.3s 0.2s;
  border-radius: 30px;
}
.blob-btn:hover {
  color: #FFFFFF;
  border-radius: 30px;
}
.blob-btn:hover:after {
  transition: all 0.3s;
  left: 0;
  top: 0;
  border-radius: 30px;
}
.blob-btn__inner {
  z-index: -1;
  overflow: hidden;
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  border-radius: 30px;
  background: #ffffff;
}
.blob-btn__blobs {
  position: relative;
  display: block;
  height: 100%;
  filter: url("#goo");
}
.blob-btn__blob {
  position: absolute;
  top: 2px;
  width: 25%;
  height: 100%;
  background: #0505A9;
  border-radius: 100%;
  transform: translate3d(0, 150%, 0) scale(1.7);
  transition: transform 0.45s;
}
@supports (filter: url("#goo")) {
  .blob-btn__blob {
    transform: translate3d(0, 150%, 0) scale(1.4);
  }
}
.blob-btn__blob:nth-child(1) {
  left: 0%;
  transition-delay: 0s;
}
.blob-btn__blob:nth-child(2) {
  left: 30%;
  transition-delay: 0.08s;
}
.blob-btn__blob:nth-child(3) {
  left: 60%;
  transition-delay: 0.16s;
}
.blob-btn__blob:nth-child(4) {
  left: 90%;
  transition-delay: 0.24s;
}
.blob-btn:hover .blob-btn__blob {
  transform: translateZ(0) scale(1.7);
}
@supports (filter: url("#goo")) {
  .blob-btn:hover .blob-btn__blob {
    transform: translateZ(0) scale(1.4);
  }
}
    </style>

// =====================================
// ИКОНКИ
// =====================================

function applyIconStyle(selectedStyle) {

    document.querySelectorAll("#icons .icon").forEach(icon => {

        const appName = icon.dataset.app;
        const img = icon.querySelector("img");

        if (selectedStyle[appName]) {
            img.src = selectedStyle[appName];
        }

    });

}


function changeIconStyle(styleName) {

    const selectedStyle = iconStyles[styleName];

    if (!selectedStyle) return;

    localStorage.setItem(
        "selectedIconStyle",
        styleName
    );

    applyIconStyle(selectedStyle);
}


// Выбор стиля
document.querySelectorAll('input[name="style"]').forEach(radio => {

    radio.addEventListener("change", function () {

        if (!this.checked) return;

        changeIconStyle(this.dataset.style);

        document.querySelectorAll('input[name="style"]')
            .forEach(input => {
                input.closest(".item")?.classList.remove("active");
            });

        this.closest(".item")?.classList.add("active");
    });

});


// =====================================
// ФОН
// =====================================

const phone = document.getElementById("phone");

const fonInputs = document.querySelectorAll(
    'input[name="fon"][data-bg]'
);

const customBackgroundButton =
    document.getElementById("customBackgroundButton");

const customBackgroundInput =
    document.getElementById("customBackgroundInput");

const fon6 =
    document.getElementById("fon6");


function applyBackground(background) {

    if (!phone || !background) return;

    phone.style.backgroundImage = `url("${background}")`;
    phone.style.backgroundSize = "cover";
    phone.style.backgroundPosition = "center center";
    phone.style.backgroundRepeat = "no-repeat";
}


// Готовый фон
fonInputs.forEach(input => {

    input.addEventListener("change", function () {

        if (!this.checked) return;

        const background = new URL(
            this.dataset.bg,
            document.baseURI
        ).href;

        localStorage.setItem(
            "phoneBackground",
            background
        );

        applyBackground(background);

        document.querySelectorAll('input[name="fon"]')
            .forEach(input => {
                input.closest(".item")?.classList.remove("active");
            });

        this.closest(".item")?.classList.add("active");

    });

});


// Своя картинка
if (customBackgroundButton && customBackgroundInput) {

    customBackgroundButton.addEventListener(
        "click",
        () => {
            customBackgroundInput.click();
        }
    );


    customBackgroundInput.addEventListener(
        "change",
        function () {

            const file = this.files[0];

            if (!file) return;

            if (!file.type.startsWith("image/")) {
                alert("Пожалуйста, выберите изображение");
                return;
            }


            const reader = new FileReader();


            reader.onload = function () {

                const imageURL = reader.result;

                try {

                    localStorage.setItem(
                        "phoneBackground",
                        imageURL
                    );

                } catch (error) {

                    alert(
                        "Не удалось сохранить изображение. " +
                        "Возможно, оно слишком большое."
                    );

                    return;
                }


                applyBackground(imageURL);

                const customPreviewImage =
                    document.getElementById("customBackgroundPreview");

                if (customPreviewImage) {
                    customPreviewImage.src = imageURL;
                }

                if (fon6) {

                    fon6.checked = true;

                    document.querySelectorAll('input[name="fon"]')
                        .forEach(input => {
                            input.closest(".item")?.classList.remove("active");
                        });

                    fon6.closest(".item")?.classList.add("active");
                }

            };


            reader.readAsDataURL(file);

        }
    );

}


// =====================================
// ЦВЕТ РАМКИ
// =====================================

const colorInputs = document.querySelectorAll(
    'input[name="color"][data-color]'
);

const customRadio =
    document.getElementById("customColorRadio");

const customPicker =
    document.getElementById("customColorPicker");

const customItem = customRadio
    ? customRadio.closest(".item")
    : null;

const customPreview = customItem
    ? customItem.querySelector(".custom-color")
    : null;


function applyPhoneColor(color) {

    if (!phone) return;

    phone.style.borderColor = color;


    // Цвет плюса
    if (customPreview) {

        customPreview.style.setProperty(
            "--custom-color",
            color
        );

    }


    // Цвет текста "Свой цвет"
    const customText =
        document.querySelector(
            ".custom-color-item strong"
        );

    if (customText) {
        customText.style.color = color;
    }

}


// Готовые цвета
colorInputs.forEach(input => {

    input.addEventListener("change", function () {

        if (!this.checked) return;

        const color = this.dataset.color;

        localStorage.setItem(
            "phoneFrameColor",
            color
        );

        applyPhoneColor(color);

        document.querySelectorAll('input[name="color"]')
            .forEach(input => {
                input.closest(".item")?.classList.remove("active");
            });

        this.closest(".item")?.classList.add("active");

    });

});


// Свой цвет
if (
    customPreview &&
    customPicker &&
    customRadio
) {

    customPreview.addEventListener(
        "click",
        function () {

            customRadio.checked = true;

            customPicker.click();

        }
    );


    customPicker.addEventListener(
        "input",
        function () {

            const color = this.value;

            localStorage.setItem(
                "phoneFrameColor",
                color
            );

            applyPhoneColor(color);

            customRadio.checked = true;

            document.querySelectorAll('input[name="color"]')
                .forEach(input => {
                    input.closest(".item")?.classList.remove("active");
                });

            customItem.classList.add("active");

        }
    );

}


// =====================================
// ЗАГРУЗКА СОХРАНЁННЫХ НАСТРОЕК
// =====================================

function loadPhoneSettings() {


    // ---------------------------------
    // ИКОНКИ
    // ---------------------------------

    const savedIconStyle =
        localStorage.getItem("selectedIconStyle");


    if (
        savedIconStyle &&
        iconStyles[savedIconStyle]
    ) {

        applyIconStyle(
            iconStyles[savedIconStyle]
        );


        // Ставим галочку на выбранный стиль
        const selectedRadio =
            document.querySelector(
                `input[name="style"][data-style="${savedIconStyle}"]`
            );

        document.querySelectorAll('input[name="style"]')
            .forEach(input => {
                input.checked = false;
                input.closest(".item")?.classList.remove("active");
            });

        if (selectedRadio) {
            selectedRadio.checked = true;
            selectedRadio.closest(".item")?.classList.add("active");
        }

    } else {

        // Если ничего ещё не сохранено — используем оригинальный стиль
        const defaultStyle = document.querySelector(
            'input[name="style"][data-style="original"]'
        );

        if (defaultStyle) {
            defaultStyle.checked = true;
            defaultStyle.closest(".item")?.classList.add("active");
        }

        changeIconStyle("original");

    }


    // ---------------------------------
    // ФОН
    // ---------------------------------

    const savedBackground =
        localStorage.getItem("phoneBackground");


    if (savedBackground) {

        applyBackground(savedBackground);

        document.querySelectorAll('input[name="fon"]')
            .forEach(input => {
                input.checked = false;
                input.closest(".item")?.classList.remove("active");
            });

        const matchingBackground =
            Array.from(fonInputs).find(input => {

                return new URL(
                    input.dataset.bg,
                    document.baseURI
                ).href === savedBackground;

            });


        if (matchingBackground) {

            matchingBackground.checked = true;

            matchingBackground.closest(".item")
                ?.classList.add("active");

        } else if (fon6) {

            // Загруженная пользователем картинка
            fon6.checked = true;
            fon6.closest(".item")?.classList.add("active");

            const customPreviewImage =
                document.getElementById("customBackgroundPreview");

            if (customPreviewImage &&
                savedBackground.startsWith("data:image/")) {
                customPreviewImage.src = savedBackground;
            }

        }

    }


    // ---------------------------------
    // ЦВЕТ РАМКИ
    // ---------------------------------

    const savedColor =
        localStorage.getItem("phoneFrameColor");


    if (savedColor) {

        applyPhoneColor(savedColor);

        document.querySelectorAll('input[name="color"]')
            .forEach(input => {
                input.checked = false;
                input.closest(".item")?.classList.remove("active");
            });

        const matchingColor =
            Array.from(colorInputs).find(input => {

                return input.dataset.color.toLowerCase() ===
                       savedColor.toLowerCase();

            });


        if (matchingColor) {

            matchingColor.checked = true;

            matchingColor.closest(".item")
                ?.classList.add("active");

        } else if (
            customRadio &&
            customPicker &&
            customPreview
        ) {

            customRadio.checked = true;

            customPicker.value = savedColor;

            customPreview.style.setProperty(
                "--custom-color",
                savedColor
            );

            customItem.classList.add("active");

        }

    }

    // ---------------------------------
    // ЗВУК
    // ---------------------------------
    loadSelectedSound();

}


// =====================================
// ЗАПУСК
// =====================================

document.addEventListener(
    "DOMContentLoaded",
    loadPhoneSettings
);

</script>

    <script>




        // =====================================
// НАСТРОЙКИ ЗВУКОВ
// duration: null = проиграть полностью

function saveSelectedSound(soundId) {
    const config = soundSettings[soundId] || soundSettings.sound1;

    localStorage.setItem('selectedSoundSettings', JSON.stringify({
        soundId: soundId,
        duration: config.duration
    }));
}

function loadSelectedSound() {
    let saved = null;

    try {
        saved = JSON.parse(localStorage.getItem('selectedSoundSettings') || 'null');
    } catch (e) {
        saved = null;
    }

    const soundId = saved?.soundId || 'sound1';
    const radio = document.getElementById(soundId.replace('sound', 'voice'));

    document.querySelectorAll('input[name="voice"]').forEach(input => {

    });

    if (radio) {

    } else {
        const defaultRadio = document.getElementById('voice1');
        if (defaultRadio) defaultRadio.checked = true;
        saveSelectedSound('sound1');
    }
}

// При выборе звука сразу сохраняем его.
document.querySelectorAll('input[name="voice"]').forEach(radio => {
    radio.addEventListener('change', () => {
        if (!radio.checked) return;
        const soundId = radio.id.replace('voice', 'sound');
        saveSelectedSound(soundId);
    });
});

function toggleSound(soundId) {
    const audio = document.getElementById(soundId);
    const img = document.getElementById('img-' + soundId);
    
    if (audio.paused) {
        audio.play().catch(error => {
            console.log('Ошибка воспроизведения:', error);
        });
        if (img) img.src = '../assets/images/play.png'; // меняем иконку на паузу
    } else {
        audio.pause();
        if (img) img.src = '../assets/images/play.png'; // меняем иконку на play
    }

        const REAL_SECONDS_PER_GAME_MINUTE = 2;     // 2 секунды реального времени = 1 игровая минута
const GAME_MINUTES_PER_DAY = 1440;           // 24 часа × 60 минут
const REAL_MS_PER_GAME_DAY = GAME_MINUTES_PER_DAY * REAL_SECONDS_PER_GAME_MINUTE * 1000; // ≈ 48 минут

// Начальное время (можно поменять)
let gameHour = 13;
let gameMinute = 7;

// Массив дней недели (начинаем с воскресенья, как часто в примерах GTA)
const daysOfWeek = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
let currentDayIndex = 6; // 0 = Вс

const timeElement = document.getElementById("time");
const dayElement = document.querySelector(".status-bar .left span:nth-child(3)"); // элемент с днём недели

// Функция форматирования времени (08:05 → 8:05, 13:40 → 13:40)
function formatGameTime() {
  const h = String(gameHour).padStart(2, "0");
  const m = String(gameMinute).padStart(2, "0");
  return `${h}:${m}`;
}

// Обновление отображения
function renderTimeAndDay() {
  timeElement.textContent = formatGameTime();
  dayElement.textContent = daysOfWeek[currentDayIndex];
}

// Основной тик времени
function advanceGameTime() {
  gameMinute++;

  if (gameMinute >= 60) {
    gameMinute = 0;
    gameHour++;

    if (gameHour >= 24) {
      gameHour = 0;
      // Смена дня недели
      currentDayIndex = (currentDayIndex + 1) % 7;
      renderTimeAndDay(); // день сменился → сразу обновляем и день
    }
  }

  renderTimeAndDay();
}

// Запускаем игру времени
setInterval(advanceGameTime, REAL_SECONDS_PER_GAME_MINUTE * 1000);

// Первое отображение (чтобы не ждать первую итерацию)
renderTimeAndDay();

    </script>
