// =====================================
// ПРИМЕНИТЬ ИКОНКИ
// =====================================

function applyIconStyle(style) {

    document.querySelectorAll("#icons .icon").forEach(icon => {

        const appName = icon.dataset.app;
        const img = icon.querySelector("img");

        if (img && style[appName]) {
            img.src = style[appName];
        }

    });

}


// =====================================
// ПРИМЕНИТЬ ФОН
// =====================================

function applyBackground(background) {

    const phone = document.getElementById("phone");

    if (!phone || !background) return;

    // Важно: фон задаём всему телефону.
    // Если ставить его отдельно на header и icons,
    // браузер масштабирует картинку два раза и она "ломается".
    phone.style.backgroundImage = `url("${background}")`;
    phone.style.backgroundSize = "cover";
    phone.style.backgroundPosition = "center center";
    phone.style.backgroundRepeat = "no-repeat";

    // На всякий случай убираем старые inline-фоны.
    const header = document.getElementById("header");
    const icons = document.getElementById("icons");

    if (header) header.style.backgroundImage = "none";
    if (icons) icons.style.backgroundImage = "none";
}


// =====================================
// ПРИМЕНИТЬ ЦВЕТ РАМКИ
// =====================================

function applyPhoneColor(color) {

    const phone = document.getElementById("phone");

    if (phone) {
        phone.style.borderColor = color;
    }

}


// =====================================
// ЗАГРУЗИТЬ ВСЕ СОХРАНЁННЫЕ НАСТРОЙКИ
// =====================================

function loadPhoneSettings() {

    // ---------------------------------
    // ИКОНКИ
    // ---------------------------------

    const savedIconStyle =
        localStorage.getItem("selectedIconStyle");

    if (
        savedIconStyle &&
        iconStyles[savedIconStyle]
    ) {

        applyIconStyle(
            iconStyles[savedIconStyle]
        );

    }


    // ---------------------------------
    // ФОН
    // ---------------------------------

    const savedBackground =
        localStorage.getItem("phoneBackground");

    if (savedBackground) {

        applyBackground(savedBackground);

    }


    // ---------------------------------
    // ЦВЕТ РАМКИ
    // ---------------------------------

    const savedColor =
        localStorage.getItem("phoneFrameColor");

    if (savedColor) {

        applyPhoneColor(savedColor);

    }

}


// =====================================
// ЗАПУСК
// =====================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadPhoneSettings();

    }
);

</script>

  <script>
  

  // =====================================
  // НАСТРОЙКИ ЗВУКОВ
  // duration: null = проиграть полностью
  // duration: число = проиграть указанное количество секунд
  // =====================================
  const soundSettings = {
    sound1:  { file: './cave21.mp3', duration: null },
    sound2:  { file: './challenge_complete_uHsY1YS.mp3', duration: 3 },
    sound3:  { file: './grakon.mp3', duration: 3 },
    sound4:  { file: './gta-v-death-sound-effect-102.mp3', duration: null },
    sound5:  { file: './melstroi-pam-pam-pam.mp3', duration: 3 },
    sound6:  { file: './minecraft-dirt-break-sound.mp3', duration: 2 },
    sound7:  { file: './ozhidanie.mp3', duration: null },
    sound8:  { file: './roblox-death-sound-effect.mp3', duration: 3 },
    sound9:  { file: './throwing-flashbang-sound-effect-cs-go.mp3', duration: 2 },
    sound10: { file: './vot-eto-povorot.mp3', duration: null }
  };

  let currentPhoneAudio = null;

  // Проигрывает выбранный в настройках звук.
  // Promise завершается только после полного проигрывания
  // или после заданного количества секунд.
  function playSelectedSound() {
    return new Promise((resolve) => {
      let saved = null;

      try {
        saved = JSON.parse(localStorage.getItem('selectedSoundSettings') || 'null');
      } catch (e) {
        saved = null;
      }

      const soundId = saved?.soundId || 'sound1';
      const config = soundSettings[soundId] || soundSettings.sound1;

      if (currentPhoneAudio) {
        currentPhoneAudio.pause();
        currentPhoneAudio.currentTime = 0;
        currentPhoneAudio = null;
      }

      const audio = new Audio(config.file);
      currentPhoneAudio = audio;
      audio.volume = 1.0;

      let finished = false;
      let timer = null;

      const finish = () => {
        if (finished) return;
        finished = true;
        if (timer) clearTimeout(timer);
        audio.removeEventListener('ended', finish);
        audio.pause();
        if (currentPhoneAudio === audio) currentPhoneAudio = null;
        resolve();
      };

      audio.addEventListener('ended', finish, { once: true });

      audio.play().catch((e) => {
        console.log('Audio error:', e);
        finish();
      });

      if (config.duration !== null) {
        timer = setTimeout(finish, config.duration * 1000);
      }
    });
  }

  // Смена заголовка при клике
  document.querySelectorAll(".icon").forEach(el => {
    el.addEventListener('mouseover', () => {
      const title = el.dataset.title || "Неизвестно";
      document.getElementById("header").textContent = title;
    });
  });
document.querySelector('.internet').addEventListener('click', async ()=>{
    await playSelectedSound();
    // Задержка 3 секунды перед переходом

    setTimeout(() => {
     window.location.href = 'https://school.mos.ru/?backUrl=https://school.mos.ru/diary/'
    }, 3000);
   
  })

  document.querySelector('.settings').addEventListener('click', async ()=>{

    setTimeout(() => {
     window.location.href = '../pageSettings/index.html'
    }, 3000);
   
  })
  
  
  
  


  // === Настройки времени как в GTA V ===
const REAL_SECONDS_PER_GAME_MINUTE = 2;     // 2 секунды реального времени = 1 игровая минута
const GAME_MINUTES_PER_DAY = 1440;           // 24 часа × 60 минут
const REAL_MS_PER_GAME_DAY = GAME_MINUTES_PER_DAY * REAL_SECONDS_PER_GAME_MINUTE * 1000; // ≈ 48 минут

// Начальное время (можно поменять)
let gameHour = 13;
let gameMinute = 7;

// Массив дней недели (начинаем с воскресенья, как часто в примерах GTA)
const daysOfWeek = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
let currentDayIndex = 6; // 0 = Вс

const timeElement = document.getElementById("time");
const dayElement = document.querySelector(".status-bar .left span:nth-child(3)"); // элемент с днём недели

// Функция форматирования времени (08:05 → 8:05, 13:40 → 13:40)
function formatGameTime() {
  const h = String(gameHour).padStart(2, "0");
  const m = String(gameMinute).padStart(2, "0");
  return `${h}:${m}`;
}

// Обновление отображения
function renderTimeAndDay() {
  timeElement.textContent = formatGameTime();
  dayElement.textContent = daysOfWeek[currentDayIndex];
}

// Основной тик времени
function advanceGameTime() {
  gameMinute++;

  if (gameMinute >= 60) {
    gameMinute = 0;
    gameHour++;

    if (gameHour >= 24) {
      gameHour = 0;
      // Смена дня недели
      currentDayIndex = (currentDayIndex + 1) % 7;
      renderTimeAndDay(); // день сменился → сразу обновляем и день
    }
  }

  renderTimeAndDay();
}

// Запускаем игру времени
setInterval(advanceGameTime, REAL_SECONDS_PER_GAME_MINUTE * 1000);

// Первое отображение (чтобы не ждать первую итерацию)
renderTimeAndDay();

</script>
